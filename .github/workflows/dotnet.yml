name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore RaceDayApi.sln

      - name: Build
        run: dotnet build RaceDayApi.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDayApi.sln --configuration Release --no-build --verbosity normal
